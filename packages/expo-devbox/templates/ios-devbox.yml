# A macOS worker that stays up so you, or a coding agent, can build and test the
# iOS app with Xcode over SSH. Written by `expo-devbox init`; start a session
# with `bunx expo-devbox start`. https://www.npmjs.com/package/expo-devbox
name: iOS devbox

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        type: string
        required: true
        description: OpenSSH public key that may log in to the worker.
      minutes:
        type: number
        description: Maximum session length in minutes, setup included.
        default: 60
      idle_minutes:
        type: number
        description: End the session after this many minutes with no SSH connection.
        default: 15

jobs:
  devbox:
    name: iOS devbox
    runs_on: macos-large
    # Custom jobs default to the production environment and its variables.
    environment: development
    env:
      SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
    steps:
      - uses: eas/checkout

      # sshd runs as the build user on localhost only. A Cloudflare quick tunnel
      # (no account needed) exposes it; clients connect with
      # `cloudflared access ssh`. Only the key from the input can log in.
      - name: Start SSH
        run: |
          dir="$HOME/.devbox"
          mkdir -p "$dir" ~/.ssh && chmod 700 ~/.ssh
          echo $(( $(date +%s) + ${{ inputs.minutes }} * 60 )) > "$dir/deadline"
          ln -sfn "$PWD" ~/project

          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          if ! ssh-keygen -lf ~/.ssh/authorized_keys; then
            echo "The ssh_public_key input is not an OpenSSH public key. Received: $SSH_PUBLIC_KEY"
            exit 1
          fi
          ssh-keygen -q -t ed25519 -N '' -f "$dir/host_key"

          # SSH sessions get only the toolchain variables, not the job's EAS
          # variables or its EXPO_TOKEN.
          echo "Job environment variables: $(env | cut -d= -f1 | sort | tr '\n' ' ')"
          env | grep -E '^(PATH|LANG|LC_[A-Z]+|DEVELOPER_DIR|NVM_[A-Z_]+|GEM_[A-Z_]+|RUBY[A-Z_]*|BUNDLE_[A-Z_]+)=' > ~/.ssh/environment
          chmod 600 ~/.ssh/environment
          echo "SSH session variables: $(cut -d= -f1 ~/.ssh/environment | tr '\n' ' ')"

          cat > "$dir/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $dir/host_key
          PidFile $dir/sshd.pid
          AuthorizedKeysFile .ssh/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          StrictModes no
          PermitUserEnvironment yes
          Subsystem sftp /usr/libexec/sftp-server
          LogLevel VERBOSE
          EOF
          /usr/sbin/sshd -f "$dir/sshd_config" -E "$dir/sshd.log"

          # Log in once with a throwaway key so an sshd problem fails here, with its log, instead of at the client.
          ssh-keygen -q -t ed25519 -N '' -f "$dir/selftest_key"
          cp ~/.ssh/authorized_keys "$dir/authorized_keys.orig"
          cat "$dir/selftest_key.pub" >> ~/.ssh/authorized_keys
          if ssh -p 2222 -i "$dir/selftest_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null 127.0.0.1 'echo SSH self-test passed'; then
            selftest=ok
          fi
          cp "$dir/authorized_keys.orig" ~/.ssh/authorized_keys
          if [ "${selftest:-}" != ok ]; then
            echo "SSH self-test failed. sshd log:"
            cat "$dir/sshd.log"
            exit 1
          fi

          curl -fsSL -o "$dir/cloudflared.tgz" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-darwin-arm64.tgz
          echo "1165d14b6f6360a3b8c283d7d1100024d6ec7cd9bc9e32519e96150645f3ec55  $dir/cloudflared.tgz" | shasum -a 256 -c -
          tar -xzf "$dir/cloudflared.tgz" -C "$dir"

          # The keep-alive step reruns this if the tunnel exits. A new tunnel gets a new host.
          cat > "$dir/tunnel.sh" <<'EOF'
          #!/bin/bash
          dir="$HOME/.devbox"
          "$dir/cloudflared" tunnel --no-autoupdate --protocol http2 --url ssh://localhost:2222 > "$dir/cloudflared.log" 2>&1 &
          echo $! > "$dir/cloudflared.pid"
          for _ in $(seq 60); do
            host=$(grep -oE '[a-z0-9-]+\.trycloudflare\.com' "$dir/cloudflared.log" | head -1 || true)
            if [ -n "$host" ]; then
              echo "DEVBOX_SSH_HOST=$host"
              exit 0
            fi
            sleep 2
          done
          cat "$dir/cloudflared.log"
          echo "The Cloudflare tunnel did not start."
          exit 1
          EOF
          chmod +x "$dir/tunnel.sh"
          "$dir/tunnel.sh"
          echo "DEVBOX_SSH_USER=$(whoami)"
          echo "DEVBOX_SSH_HOSTKEY=$(cut -d' ' -f1,2 "$dir/host_key.pub")"

      - uses: eas/install_node_modules

      - name: Prebuild and install pods
        run: |
          if [ -d ios ]; then
            echo "Using the committed ios directory."
          else
            npx expo prebuild --platform ios --no-install
            touch ~/.devbox/cng
          fi
          cd ios && pod install

      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available --json | node -e '
            const { devices } = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const version = (runtime) => (runtime.match(/iOS-(\d+)-(\d+)/) ?? [0, 0, 0]).slice(1).map(Number);
            const iphones = Object.keys(devices)
              .filter((r) => r.includes("iOS"))
              .sort((a, b) => version(b)[0] - version(a)[0] || version(b)[1] - version(a)[1])
              .flatMap((r) => devices[r])
              .filter((d) => d.name.startsWith("iPhone"));
            const d = iphones.find((d) => /^iPhone \d+ Pro$/.test(d.name)) ?? iphones[0];
            console.log(d.udid);')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "$udid" > ~/.devbox/sim
          xcrun simctl list devices booted

      - name: Keep the worker up
        run: |
          dir="$HOME/.devbox"
          start_metro() {
            # EAS sets CI=true, which makes Metro ignore file changes.
            env -u CI npx expo start --localhost > "$dir/metro.log" 2>&1 < /dev/null &
          }
          start_metro
          # The same xcodebuild arguments as `expo-devbox build`, so its first build is incremental.
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(node -p 'try { require("./devbox.json").scheme || "" } catch { "" }')
          xcodebuild -workspace "$workspace" -scheme "${scheme:-$(basename "$workspace" .xcworkspace)}" \
            -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$(cat "$dir/sim")" \
            -derivedDataPath "$dir/DerivedData" build > "$dir/xcodebuild.log" 2>&1 \
            || echo "The warm-up build failed. Run expo-devbox build to see why."
          touch "$dir/ready"
          echo "Devbox ready at ~/project."

          deadline=$(cat "$dir/deadline")
          idle_limit=$(( ${{ inputs.idle_minutes }} * 60 ))
          last_active=$(date +%s)
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 20
            now=$(date +%s)
            if netstat -an -p tcp | grep -q '127\.0\.0\.1\.2222 .*ESTABLISHED'; then
              last_active=$now
            elif [ $(( now - last_active )) -ge "$idle_limit" ]; then
              echo "No SSH connection for ${{ inputs.idle_minutes }} minutes. Ending the session."
              exit 0
            fi
            if ! kill -0 "$(cat "$dir/cloudflared.pid")" 2> /dev/null; then
              echo "The tunnel exited. Starting a new one."
              "$dir/tunnel.sh" || true
            fi
            # Two misses in a row, so a Metro that is still starting is left alone.
            if curl -sf http://localhost:8081/status > /dev/null; then
              metro_misses=0
            elif [ $(( metro_misses = ${metro_misses:-0} + 1 )) -ge 2 ]; then
              echo "Metro is not responding. Restarting it."
              pkill -f "expo start" || true
              start_metro
              metro_misses=0
            fi
          done
          echo "Reached the ${{ inputs.minutes }}-minute limit. Ending the session."
